

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saurav Verse</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    #world {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #hint {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    #hint.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <video id="arrival" playsinline controls preload="auto">
    <source src="arrival.mp4" type="video/mp4">
  </video>

  <img id="world" src="image 8.png" alt="Saurav Verse world">

  <div id="hint">DRAG TO LOOK AROUND</div>

  <script>
    const video = document.getElementById("arrival");
    const world = document.getElementById("world");
    const hint = document.getElementById("hint");

    let currentImage = 8;
    let startX = 0;
    let startY = 0;
    let moved = false;

    // Preload all world images.
    [
      "image 8.png",
      "image 9.png",
      "image 10.png",
      "image 11.png"
    ].forEach(src => {
      const img = new Image();
      img.src = src;
    });

    // Arrival video -> Image 8.
    video.addEventListener("ended", () => {
      video.style.display = "none";
      world.style.display = "block";

      requestAnimationFrame(() => {
        world.style.opacity = "1";
      });

      setTimeout(() => {
        hint.classList.add("show");
      }, 700);

      setTimeout(() => {
        hint.classList.remove("show");
      }, 3200);
    });

    function showImage(number) {
      currentImage = number;
      world.style.opacity = "0";

      setTimeout(() => {
        world.src = "image " + number + ".png";

        requestAnimationFrame(() => {
          world.style.opacity = "1";
        });
      }, 250);
    }

    world.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      moved = false;
    }, {passive: true});

    world.addEventListener("touchmove", e => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
        moved = true;
      }
    }, {passive: true});

    world.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;

      const dx = endX - startX;
      const dy = endY - startY;

      // Tap.
      if (!moved && Math.abs(dx) < 40 && Math.abs(dy) < 40) {
        if (currentImage === 10) {
          showImage(11);
        } else if (currentImage === 11) {
          showImage(10);
        }
        return;
      }

      // Swipe.
      if (Math.abs(dx) > 100 && Math.abs(dx) > Math.abs(dy)) {

        if (currentImage === 8) {
          if (dx > 100) {
            // Look back at the vehicle.
            showImage(9);
          } else {
            // Look toward the mystery.
            showImage(10);
          }
        }

        else if (currentImage === 9 && dx < -100) {
          showImage(8);
        }

        else if (currentImage === 10 && dx > 100) {
          showImage(8);
        }
      }
    }, {passive: true});

    // Basic mouse support for desktop.
    let mouseDown = false;
    let mouseStartX = 0;

    world.addEventListener("mousedown", e => {
      mouseDown = true;
      mouseStartX = e.clientX;
    });

    window.addEventListener("mouseup", e => {
      if (!mouseDown) return;
      mouseDown = false;

      const dx = e.clientX - mouseStartX;

      if (Math.abs(dx) > 100) {
        if (currentImage === 8) {
          if (dx > 100) showImage(9);
          else showImage(10);
        } else if (currentImage === 9 && dx < -100) {
          showImage(8);
        } else if (currentImage === 10 && dx > 100) {
          showImage(8);
        }
      }
    });
  </script>

</body>
</html>
